name: Link Check

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/resource-catalog.json'
      - 'scripts/**/*.py'
      - '.github/workflows/links.yml'

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --accept 200 README.md CONTRIBUTING.md SECURITY.md docs .github
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate catalog coverage
        run: python3 scripts/validate_catalog_coverage.py
      - name: Verify generated catalog freshness
        run: python3 scripts/export_catalog.py --check
      - name: Validate generated catalog integrity
        run: python3 scripts/validate_catalog_integrity.py
